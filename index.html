<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <!--Search Bar-->
      <div class="search-city">
        <input type="text" class="search-bar" placeholder="City" />
        <button class="search-button">Search</button>
      </div>
      <!--Primary Details-->
      <div class="temp-container">
        <div class="location-date">
          <p>Karachi, Pakistan</p>
          <p>Sunday, 26 July</p>
        </div>
        <div class="temp">
          <p class="temp-num">33 C</p>
          <p>Partly Cloudy</p>
        </div>
      </div>
      <!--Secondary Details-->
      <div class="secondary-details">
        <div class="humidity">
          <p>Humidity</p>
          <hr />
          <p>60%</p>
        </div>
        <div class="wind">
          <p>Wind</p>
          <hr />
          <p>87 km/h</p>
        </div>
        <div class="precip">
          <p>Precipitation</p>
          <hr />
          <p>10%</p>
        </div>
      </div>
      <!--5-Days Forecast-->
      <div class="five-days-forecast">
        <div class="day1">Monday</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
